<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>또박또박 한글 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#8FD3F4; --board:#FFFFFF; --ink:#1E2B5C; --ink-soft:#56628E; --frame:#1E2B5C;
  --tile:#FFFFFF; --tile-edge:#D3DCEE; --bubble:#FFFFFF; --mute:#E7EEF8;
  --g:#5CC93A; --gd:#3E9A22; --p:#FF7AA8; --pd:#D9507F; --y:#FFC21F; --yd:#D69A00;
  --o:#FF8A26; --od:#D2650A; --b:#3FA2FF; --bd:#1F78D1; --v:#9A7BFF; --vd:#6F50D9;
  --ui:'Jua','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --letter:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --sky:#0F1838; --board:#1A2350; --ink:#F2F5FF; --ink-soft:#AEB8DE; --frame:#FFC21F;
  --tile:#24306A; --tile-edge:#0C1330; --bubble:#24306A; --mute:#2C3876; color-scheme:dark; } }
:root[data-theme="dark"]{
  --sky:#0F1838; --board:#1A2350; --ink:#F2F5FF; --ink-soft:#AEB8DE; --frame:#FFC21F;
  --tile:#24306A; --tile-edge:#0C1330; --bubble:#24306A; --mute:#2C3876; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--sky);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:4px solid var(--b);outline-offset:3px}
#app{max-width:1200px;height:100%;margin:0 auto;padding:10px 14px 14px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px}
.wordmark{display:flex;gap:2px;font-family:var(--letter);font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1}
.wordmark span{display:inline-block}
.iconbtn{width:50px;height:50px;border-radius:50%;background:var(--tile);box-shadow:0 4px 0 var(--tile-edge);display:grid;place-items:center}
.iconbtn svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
.right{display:flex;gap:8px;align-items:center}
.stars{display:flex;align-items:center;gap:6px;background:var(--tile);box-shadow:0 4px 0 var(--tile-edge);border-radius:99px;padding:8px 16px 8px 10px;font-size:22px}
.stars svg{width:26px;height:26px}
.stars.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.board{flex:1;min-height:0;background:var(--board);border:6px solid var(--frame);border-radius:28px;box-shadow:0 8px 0 rgba(30,43,92,.28);display:flex;flex-direction:column;overflow:hidden;position:relative}
.host{display:flex;align-items:center;gap:12px;padding:14px 18px 0}
.host img{width:68px;height:68px;border-radius:50%;flex:none;box-shadow:0 0 0 4px var(--board),0 0 0 7px var(--frame)}
.bubble{position:relative;background:var(--bubble);border:3px solid var(--frame);border-radius:20px;padding:9px 16px;font-size:clamp(18px,2.4vw,25px);line-height:1.35}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;width:16px;height:16px;background:var(--bubble);border-left:3px solid var(--frame);border-bottom:3px solid var(--frame);transform:translateY(-50%) rotate(45deg)}
.hear{margin-left:auto;flex:none}
.content{flex:1;min-height:0;overflow:auto;padding:14px 20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.title{font-size:clamp(26px,3.4vw,40px);text-align:center;margin:0}
.sub{font-size:clamp(16px,1.9vw,21px);color:var(--ink-soft);text-align:center;margin:0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{font-size:clamp(19px,2.2vw,24px);padding:12px 22px;border-radius:18px;background:var(--y);color:#1E2B5C;box-shadow:0 5px 0 var(--yd)}
.btn.ghost{background:var(--tile);color:var(--ink);box-shadow:0 5px 0 var(--tile-edge);border:3px solid var(--tile-edge)}
.btn:active,.tile:active,.mt:active,.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tile-edge)}
/* 자석 글자 */
.mag{font-family:var(--letter);font-weight:900;color:var(--c);line-height:1;
  text-shadow:0 1px 0 var(--cd),0 2px 0 var(--cd),0 3px 0 var(--cd),0 4px 0 var(--cd),0 5px 0 var(--cd),0 9px 10px rgba(30,43,92,.22)}
.c0{--c:var(--g);--cd:var(--gd)}.c1{--c:var(--p);--cd:var(--pd)}.c2{--c:var(--y);--cd:var(--yd)}
.c3{--c:var(--o);--cd:var(--od)}.c4{--c:var(--b);--cd:var(--bd)}.c5{--c:var(--v);--cd:var(--vd)}
/* 메뉴 자석 */
.menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;width:100%;max-width:980px}
.mt{background:var(--c);box-shadow:0 7px 0 var(--cd);border-radius:22px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotate(var(--r,0deg));color:#1E2B5C}
.mt.light{color:#fff}
.mt img{width:clamp(56px,7vw,78px);height:auto;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.85)}
.mt b{font-weight:normal;font-size:clamp(19px,2.2vw,25px);text-align:center;line-height:1.15}
.mt small{font-size:clamp(13px,1.4vw,16px);opacity:.85;text-align:center;line-height:1.2}
.home{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:center;width:100%;max-width:1000px}
.home img.group{width:100%;height:auto}
.home .doors{display:flex;flex-direction:column;gap:20px}
.door{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:24px;background:var(--c);box-shadow:0 8px 0 var(--cd);text-align:left;color:#1E2B5C}
.door .mag{font-size:clamp(44px,6vw,66px);--c:#fff;--cd:rgba(0,0,0,.18)}
.door b{font-weight:normal;font-size:clamp(24px,3vw,34px);display:block}
.door small{font-size:clamp(15px,1.7vw,19px);opacity:.85}
.namebtn{font-size:18px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px}
/* 글자 고르기 */
.lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;width:100%;max-width:900px}
.lgrid.v{grid-template-columns:repeat(5,minmax(0,1fr));max-width:700px}
.tile{background:var(--tile);border-radius:20px;box-shadow:0 6px 0 var(--tile-edge);border:3px solid var(--tile-edge);aspect-ratio:1;display:grid;place-items:center}
.tile .mag{font-size:clamp(34px,5.2vw,64px)}
/* 글자 자세히 */
.letter{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;width:100%;max-width:940px}
.big{font-size:clamp(130px,24vw,240px)}
.lname{font-size:clamp(28px,3.6vw,44px);margin:0}
.words{display:flex;gap:12px;flex-wrap:wrap}
.wc{background:var(--tile);border:3px solid var(--tile-edge);box-shadow:0 5px 0 var(--tile-edge);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;min-width:96px}
.wc .e{font-size:clamp(40px,5vw,56px);line-height:1.1}
.wc .w{font-family:var(--letter);font-weight:700;font-size:clamp(20px,2.4vw,28px)}
.wc .w em{font-style:normal;color:var(--o)}
/* 따라 쓰기 */
.trace{position:relative;width:min(56vh,82vw,420px);aspect-ratio:1;background:var(--tile);border:4px dashed var(--tile-edge);border-radius:24px;touch-action:none}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:20px}
/* 퀴즈 */
.qpic{display:flex;flex-direction:column;align-items:center}
.qpic .e{font-size:clamp(88px,15vw,150px);line-height:1.05}
.qpic .w{font-family:var(--letter);font-weight:700;font-size:clamp(28px,3.6vw,42px)}
.qpic .w .blank{display:inline-block;width:1em;border-bottom:5px solid var(--o);color:transparent}
.choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.choice{width:clamp(96px,14vw,150px);aspect-ratio:1;background:var(--tile);border:3px solid var(--tile-edge);border-radius:24px;box-shadow:0 6px 0 var(--tile-edge);display:grid;place-items:center}
.choice .mag{font-size:clamp(52px,8vw,92px)}
.choice.right{border-color:var(--g);box-shadow:0 6px 0 var(--gd)}
.choice.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.dots{display:flex;gap:7px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--mute)}
.dots i.on{background:var(--y)}
/* 합치기 */
.slots{display:flex;align-items:center;gap:12px;font-size:clamp(30px,4vw,46px)}
.slot{width:clamp(84px,12vw,128px);aspect-ratio:1;border-radius:22px;border:4px dashed var(--tile-edge);display:grid;place-items:center;background:var(--tile)}
.slot.res{border-style:solid;border-color:var(--y)}
.slot .mag{font-size:clamp(50px,7.4vw,84px)}
.keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px}
.key{width:clamp(46px,6vw,60px);aspect-ratio:1;background:var(--tile);border:3px solid var(--tile-edge);border-radius:14px;box-shadow:0 4px 0 var(--tile-edge);display:grid;place-items:center}
.key .mag{font-size:clamp(24px,3.4vw,34px);text-shadow:0 1px 0 var(--cd),0 2px 0 var(--cd),0 3px 0 var(--cd)}
.key.on{border-color:var(--y);background:var(--mute)}
/* 풍선 */
.sky{position:relative;width:100%;flex:1;min-height:300px;overflow:hidden;border-radius:20px;background:var(--mute)}
.balloon{position:absolute;bottom:-150px;width:clamp(76px,10vw,104px);aspect-ratio:.82;border-radius:50% 50% 47% 47%;background:var(--c);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12);display:grid;place-items:center;animation:rise var(--t,7s) linear forwards}
.balloon::after{content:"";position:absolute;bottom:-30px;left:50%;width:2px;height:30px;background:var(--ink-soft)}
.balloon .mag{font-size:clamp(38px,5vw,52px);--c:#fff;--cd:rgba(0,0,0,.25)}
.balloon.pop{animation:pop .28s forwards}
.balloon.nope{animation:rise var(--t,7s) linear forwards,shake .4s}
@keyframes rise{to{transform:translateY(calc(-1 * (var(--h,600px) + 200px)))}}
@keyframes pop{to{transform:var(--at,none) scale(1.6);opacity:0}}
.target{display:flex;align-items:center;gap:12px;font-size:clamp(20px,2.4vw,26px)}
.target .tile{width:clamp(64px,8vw,84px)}
/* 짝꿍 */
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:860px}
.card{background:var(--tile);border:3px solid var(--tile-edge);box-shadow:0 5px 0 var(--tile-edge);border-radius:18px;min-height:clamp(84px,12vh,120px);display:grid;place-items:center;padding:8px}
.card .e{font-size:clamp(40px,6vw,60px)}
.card .w{font-family:var(--letter);font-weight:700;font-size:clamp(22px,3vw,32px)}
.card.sel{border-color:var(--b);box-shadow:0 5px 0 var(--bd)}
.card.done{visibility:hidden}
.card.wrong{animation:shake .4s}
/* 마을 */
.village{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 26px;width:100%;max-width:860px}
.house{display:flex;flex-direction:column;align-items:center;gap:8px}
.house .roof{width:100%;aspect-ratio:2.6;background:var(--cd);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house .wall{width:84%;margin-top:-2px;background:var(--c);border-radius:0 0 14px 14px;padding:12px 0 14px;display:flex;justify-content:center;box-shadow:0 6px 0 var(--cd)}
.house .wall img{width:clamp(56px,8vw,84px);border-radius:50%;box-shadow:0 0 0 5px #fff}
.house b{font-weight:normal;font-size:clamp(19px,2.2vw,24px)}
.house.mine .wall{padding:18px 0 20px}
.house.mine .wall .mag{font-size:clamp(42px,6vw,64px);--c:#fff;--cd:rgba(0,0,0,.2)}
/* 방 꾸미기 */
.roombox{width:100%;max-width:900px;display:flex;flex-direction:column;gap:12px}
.room{position:relative;width:100%;aspect-ratio:1000/590;background-size:cover;background-position:center;border-radius:20px;overflow:hidden;border:4px solid var(--frame);touch-action:none}
.piece{position:absolute;transform:translate(-50%,-50%);width:15%;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.piece img{width:100%;display:block;pointer-events:none}
.piece .e{display:block;text-align:center;font-size:clamp(34px,6vw,64px);line-height:1}
.piece.flip img,.piece.flip .e{transform:scaleX(-1)}
.piece.sel{outline:3px dashed var(--b);outline-offset:4px;border-radius:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:14px;background:var(--tile);border:3px solid var(--tile-edge);font-size:19px}
.tabs button.on{background:var(--y);border-color:var(--yd);color:#1E2B5C}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:46px;height:30px;border-radius:9px;background-size:cover;background-position:center;border:3px solid var(--tile-edge)}
.swatches button.on{border-color:var(--b)}
.shop{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.item{flex:none;width:112px;background:var(--tile);border:3px solid var(--tile-edge);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px}
.item .pic{height:52px;display:grid;place-items:center}
.item .pic img{height:52px}
.item .pic .e{font-size:40px}
.item .cost{display:flex;align-items:center;gap:3px;color:var(--ink-soft)}
.item .cost svg{width:16px;height:16px}
.item.placed{border-color:var(--g)}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:48px}
/* 친구 집 */
.friend{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:640px;background:var(--c);border-radius:28px;padding:22px;box-shadow:0 8px 0 var(--cd);color:#1E2B5C}
.friend img{width:clamp(130px,22vw,190px);border-radius:50%;box-shadow:0 0 0 7px #fff}
.friend p{margin:0;font-size:clamp(20px,2.6vw,28px);text-align:center}
.friend .fav{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 18px}
.friend .fav .mag{font-size:56px}
.friend .fav span{font-family:var(--letter);font-weight:700;font-size:28px;color:#1E2B5C}
/* 축하 */
.party{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.party i{position:absolute;top:-40px;width:26px;height:26px;background:var(--c);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg)}}
.namebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.namebox input{font:inherit;font-size:24px;padding:10px 14px;border-radius:14px;border:3px solid var(--tile-edge);background:var(--tile);color:var(--ink);width:min(260px,70vw)}
.note{font-size:15px;color:var(--ink-soft);text-align:center;margin:0;max-width:640px;line-height:1.5}
@media (max-width:760px){
  .menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .home{grid-template-columns:1fr}
  .lgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .lgrid.v{grid-template-columns:repeat(4,minmax(0,1fr))}
  .letter{grid-template-columns:1fr;justify-items:center;text-align:center}
  .words{justify-content:center}
  .pairs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .village{grid-template-columns:repeat(2,minmax(0,1fr))}
  .host img{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  .balloon{animation-duration:calc(var(--t,7s) * 1.6)}
  .party i{animation-duration:2.4s}
  .choice.wrong,.card.wrong,.balloon.nope{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="iconbtn" id="homeBtn" aria-label="처음 화면으로"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
    <div class="wordmark" aria-label="또박또박"><span class="mag c4" style="transform:rotate(-5deg)">또</span><span class="mag c1" style="transform:rotate(4deg)">박</span><span class="mag c0" style="transform:rotate(-3deg)">또</span><span class="mag c3" style="transform:rotate(5deg)">박</span></div>
    <div class="right">
      <button class="iconbtn" id="soundBtn" aria-label="소리 끄기"></button>
      <div class="stars" id="stars" aria-label="모은 별"><svg viewBox="0 0 24 24"><path fill="#FFC21F" stroke="#D69A00" stroke-width="1.5" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg><span id="starN">0</span></div>
    </div>
  </div>
  <div class="board">
    <div class="host"><img id="hostImg" alt=""><div class="bubble" id="bubble"></div><button class="iconbtn hear" id="hearBtn" aria-label="다시 듣기"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></svg></button></div>
    <div class="content" id="view"></div>
    <div class="party" id="party"></div>
  </div>
</div>

const compose=(c,v)=>String.fromCharCode(0xAC00+(CHO.indexOf(c)*21+JUNG.indexOf(v))*28);

const hasBatchim=ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172&&c%28!==0};
const finalIdx=ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?c%28:0};
const jo=(w,a,b)=>w+(hasBatchim(String(w).slice(-1))?a:b);
const eun=w=>jo(w,'은','는'),eul=w=>jo(w,'을','를'),ya=w=>jo(w,'이야','야');

let voice=null;
function loadVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){}}

function speak(t){
  if(!S.sound||!('speechSynthesis' in window))return;
  const clean=String(t).replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\uFE0F]/gu,'').trim();
  if(!clean)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean);u.lang='ko-KR';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.12;speechSynthesis.speak(u)}catch(e){}
}
let actx=null;
function tone(freqs,dur=.16,type='sine',gain=.16){
  if(!S.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      const t0=actx.currentTime+i*dur*.8;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gain,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+dur*1.6);
      o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+dur*1.7)})}catch(e){}
}

function traceView(kind,l){
  clearTimers();
  const host=kind==='c'?'chorok':'gli',list=kind==='c'?C:V,ci=list.indexOf(l)%6;
  say(host,`흐린 ${NAME[l]} 위를 손가락으로 따라 써 봐!`);
  view(`<div class="trace" id="pad"><canvas id="guide"></canvas><canvas id="ink"></canvas></div>
        <div class="row"><button class="btn ghost" id="clr">지우기</button><button class="btn" id="done">다 썼어</button><button class="btn ghost" id="back">돌아가기</button></div>`);
  const pad=$('pad'),G=$('guide'),I=$('ink');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  let W=0,strokes=[],cur=null;
  const colorVar=getComputedStyle(document.documentElement).getPropertyValue(['--g','--p','--y','--o','--b','--v'][ci]).trim()||'#3FA2FF';
  function glyph(ctx,size,fill,fat=0){ctx.clearRect(0,0,size,size);ctx.font=`900 ${size*.78}px ${getComputedStyle(document.documentElement).getPropertyValue('--letter')}`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=fill;ctx.fillText(l,size/2,size*.53);
    if(fat){ctx.lineWidth=fat;ctx.strokeStyle=fill;ctx.lineJoin='round';ctx.strokeText(l,size/2,size*.53)}}
  function layout(){W=pad.clientWidth;[G,I].forEach(c=>{c.width=W*dpr;c.height=W*dpr});
    const g=G.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);glyph(g,W,getComputedStyle(document.documentElement).getPropertyValue('--mute').trim()||'#E7EEF8');redraw()}
  function redraw(){const c=I.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,W);c.lineCap='round';c.lineJoin='round';c.strokeStyle=colorVar;c.lineWidth=W*.075;
    strokes.forEach(s=>{c.beginPath();s.forEach((p,k)=>k?c.lineTo(p[0]*W,p[1]*W):c.moveTo(p[0]*W,p[1]*W));if(s.length===1)c.lineTo(s[0][0]*W+.1,s[0][1]*W);c.stroke()})}
  const pos=e=>{const r=I.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  I.addEventListener('pointerdown',e=>{I.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);redraw()});
  I.addEventListener('pointermove',e=>{if(!cur)return;cur.push(pos(e));redraw()});
  const end=()=>{cur=null};I.addEventListener('pointerup',end);I.addEventListener('pointercancel',end);
  layout();if(document.fonts&&document.fonts.load)document.fonts.load('900 100px "Noto Sans KR"',l).then(layout).catch(()=>{});
  window.addEventListener('resize',layout,{once:true});
  $('clr').onclick=()=>{strokes=[];redraw()};
  $('back').onclick=()=>letterView(kind,l);
  $('done').onclick=()=>{
    const N=96,mk=()=>{const c=document.createElement('canvas');c.width=c.height=N;return c.getContext('2d')};
    const g=mk();glyph(g,N,'#000');const gf=mk();glyph(gf,N,'#000',N*.09);
    const u=mk(),uf=mk();[[u,N*.075],[uf,N*.2]].forEach(([c,lw])=>{c.lineCap='round';c.lineJoin='round';c.strokeStyle='#000';c.lineWidth=lw;
      strokes.forEach(s=>{c.beginPath();s.forEach((p,k)=>k?c.lineTo(p[0]*N,p[1]*N):c.moveTo(p[0]*N,p[1]*N));if(s.length===1)c.lineTo(s[0][0]*N+.1,s[0][1]*N);c.stroke()})});
    const d=c=>c.getImageData(0,0,N,N).data;const G1=d(g),GF=d(gf),U=d(u),UF=d(uf);
    let gN=0,cov=0,uN=0,out=0;for(let k=3;k<G1.length;k+=4){if(G1[k]>100){gN++;if(UF[k]>100)cov++}if(U[k]>100){uN++;if(GF[k]<100)out++}}
    const coverage=gN?cov/gN:0,stray=uN?out/uN:1;
    if(uN<20){say(host,'손가락으로 글자 위를 꾹 눌러서 그려 봐!');return}
    if(coverage>.68&&stray<.35){ding();addStar(2);party();say(host,`우아, ${eul(NAME[l])} 또박또박 잘 썼어! 별 두 개!`)}
    else if(coverage<=.68){oops();say(host,'조금 더 채워 볼까? 흐린 글자를 끝까지 따라가 봐!')}
    else{oops();say(host,'글자 밖으로 조금 나갔어. 지우고 다시 해 볼까?')}
  };
}
/* ---------- 그림 / 소리 퀴즈 ---------- */
function quiz(type){
  clearTimers();
  const host=type==='picture'?'darami':'ttobi';
  const qs=shuffle(BANK).slice(0,10);let n=0,first=true;
  function ask(){
    first=true;const q=qs[n];
    const opts=shuffle([q.c,...shuffle(C.filter(x=>x!==q.c)).slice(0,2)]);
    if(type==='picture')say(host,`${q.w}! 어떤 글자로 시작할까?`);else say(host,`잘 들어 봐. ${q.w}! 어떤 글자로 시작할까?`);
    const pic=type==='picture'?`<div class="qpic"><span class="e">${q.e}</span><span class="w"><span class="blank">${esc(q.w[0])}</span>${esc(q.w.slice(1))}</span></div>`
                               :`<div class="qpic"><button class="btn" id="again" style="font-size:26px">한 번 더 듣기</button></div>`;
    view(`<div class="dots">${qs.map((_,k)=>`<i class="${k<n?'on':''}"></i>`).join('')}</div>${pic}
          <div class="choices">${opts.map(o=>`<button class="choice" data-o="${o}" aria-label="${NAME[o]}">${mag(o,C.indexOf(o))}</button>`).join('')}</div>`);
    if(type==='listen')$('again').onclick=()=>speak(q.w);
    on('[data-o]',e=>{
      const b=e.currentTarget,o=b.dataset.o;
      if(o===q.c){ding();b.classList.add('right');if(first)addStar(1);
        VIEW.querySelectorAll('[data-o]').forEach(x=>x.disabled=true);
        if(type==='picture'){const bl=VIEW.querySelector('.blank');if(bl){bl.style.color='var(--o)';bl.style.borderColor='transparent'}}
        else{VIEW.querySelector('.qpic').innerHTML=`<span class="e">${q.e}</span><span class="w">${esc(q.w)}</span>`}
        say(host,`맞아! ${eun(q.w)} ${ro(NAME[q.c])} 시작해.`);
        later(()=>{n++;if(n<qs.length)ask();else finish(host,()=>quiz(type))},1900);
      }else{oops();first=false;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');say(host,`그건 ${ya(NAME[o])}. 다시 골라 볼까?`)}
    });
  }
  ask();
}
function finish(host,again){
  party();ding();
  say(host,`다 했다! ${kid()}, 정말 잘했어!`);
  view(`<p class="title">다 했다!</p><p class="sub">모은 별은 별빛 마을에서 쓸 수 있어요.</p>
        <div class="row"><button class="btn" id="again">한 번 더</button><button class="btn ghost" id="menu">다른 놀이</button><button class="btn ghost" id="vil">별빛 마을 가기</button></div>`);
  $('again').onclick=again;$('menu').onclick=learnMenu;$('vil').onclick=village;
}
/* ---------- 글자 합치기 ---------- */
function build(){
  clearTimers();
  let c=null,v=null,mode='free',goal=null;
  say('pangi','자음 하나, 모음 하나를 골라서 붙여 봐!');
  function render(){
    const res=c&&v?compose(c,v):'';
    view(`${mode==='quiz'?`<p class="sub">팡이가 말한 글자를 만들어 봐</p>`:''}
      <div class="slots"><div class="slot">${c?mag(c,C.indexOf(c)):''}</div>+<div class="slot">${v?mag(v,V.indexOf(v)+2):''}</div>=<div class="slot res">${res?mag(res,4):(mode==='quiz'?'<span class="mag c2" style="font-size:44px">?</span>':'')}</div></div>
      <div class="keys">${C.map((x,i)=>`<button class="key ${x===c?'on':''}" data-c="${x}" aria-label="${NAME[x]}">${mag(x,i)}</button>`).join('')}</div>
      <div class="keys">${V.map((x,i)=>`<button class="key ${x===v?'on':''}" data-v="${x}" aria-label="${NAME[x]}">${mag(x,i+2)}</button>`).join('')}</div>
      <div class="row">${mode==='free'?'<button class="btn" id="toQuiz">문제 내 줘</button>':'<button class="btn" id="hearGoal">문제 다시 듣기</button><button class="btn ghost" id="toFree">자유롭게 놀기</button>'}<button class="btn ghost" id="back">놀이 고르기</button></div>`);
    on('[data-c]',e=>{c=e.currentTarget.dataset.c;speak(NAME[c]);after()});
    on('[data-v]',e=>{v=e.currentTarget.dataset.v;speak(NAME[v]);after()});
    $('back').onclick=learnMenu;
    if(mode==='free')$('toQuiz').onclick=()=>{mode='quiz';newGoal()};
    else{$('hearGoal').onclick=()=>speak(goal);$('toFree').onclick=()=>{mode='free';c=v=null;say('pangi','자유롭게 붙여 봐!');render()}}
  }
  function after(){
    render();
    if(c&&v){const r=compose(c,v);
      if(mode==='free'){later(()=>speak(r),500);say('pangi',`${NAME[c]}에 ${eul(NAME[v])} 붙이면 ${r}!`,false)}
      else if(r===goal){ding();addStar(1);say('pangi',`맞아! ${r}!`);later(newGoal,1700)}
      else{oops();say('pangi',`이건 ${r}야. ${goal}를 만들어 볼까?`)}
    }
  }
  function newGoal(){c=v=null;goal=compose(rnd(C),rnd(V));say('pangi',`${goal}를 만들어 봐!`);render()}
  render();
}
/* ---------- 풍선 ---------- */
let balloonLoop=null;
function balloonMenu(){
  clearTimers();
  say('gli','어떤 풍선을 터뜨려 볼까?');
  view(`<p class="title">풍선 터뜨리기</p><p class="sub">글리가 말하는 글자 풍선을 톡 눌러요. 여덟 개 맞히면 끝!</p>
    <div class="row"><button class="btn" data-k="c">자음 풍선</button><button class="btn" data-k="v">모음 풍선</button><button class="btn ghost" id="back">놀이 고르기</button></div>`);
  on('[data-k]',e=>balloon(e.currentTarget.dataset.k));$('back').onclick=learnMenu;
}
function balloon(kind){
  clearTimers();
  const list=kind==='c'?C:V;let goal=null,hits=0,lastGoal=null;
  view(`<div class="target"><span>찾을 글자</span><div class="tile" id="goal"></div><div class="dots" id="hits">${'<i></i>'.repeat(8)}</div></div><div class="sky" id="sky"></div>
        <div class="row"><button class="btn ghost" id="back">그만하기</button></div>`);
  $('back').onclick=balloonMenu;
  const sky=$('sky');
  function newGoal(){do{goal=rnd(list)}while(goal===lastGoal);lastGoal=goal;$('goal').innerHTML=mag(goal,list.indexOf(goal));say('gli',`${NAME[goal]} 풍선을 찾아 봐!`)}
  function spawn(){
    if(!document.body.contains(sky))return;
    const b=document.createElement('button');const l=Math.random()<.4?goal:rnd(list);
    b.className='balloon '+colorOf(Math.floor(Math.random()*6));b.innerHTML=mag(l,0);b.dataset.l=l;b.setAttribute('aria-label',NAME[l]+' 풍선');
    const h=sky.clientHeight;b.style.setProperty('--h',h+'px');b.style.setProperty('--t',(6+Math.random()*2.5)+'s');
    b.style.left=(4+Math.random()*82)+'%';
    b.onclick=()=>{
      if(b.dataset.l===goal&&!b.classList.contains('pop')){
        ding();addStar(1);hits++;const st=getComputedStyle(b).transform;b.style.setProperty('--at',st==='none'?'none':st);b.classList.add('pop');
        $('hits').innerHTML=Array.from({length:8},(_,k)=>`<i class="${k<hits?'on':''}"></i>`).join('');
        setTimeout(()=>b.remove(),300);
        if(hits>=8){clearInterval(balloonLoop);balloonLoop=null;later(()=>finish('gli',()=>balloon(kind)),600)}else later(newGoal,500);
      }else if(b.dataset.l!==goal){oops();say('gli',`그건 ${ya(NAME[b.dataset.l])}!`,true)}
    };
    b.addEventListener('animationend',ev=>{if(ev.animationName==='rise')b.remove()});
    sky.appendChild(b);
  }
  newGoal();spawn();balloonLoop=setInterval(spawn,1050);
}
/* ---------- 짝꿍 ---------- */
function pairs(){
  clearTimers();
  const P=window.innerWidth<760?3:6;
  const set=[];const seen=new Set();for(const b of shuffle(BANK)){if(!seen.has(b.e)){seen.add(b.e);set.push(b)}if(set.length===P)break}
  const cards=shuffle([...set.map(b=>({k:b.w,t:'e',v:b.e})),...set.map(b=>({k:b.w,t:'w',v:b.w}))]);
  let sel=null,left=set.length;
  say('chorok','그림이랑 낱말 짝꿍을 찾아 줘!');
  view(`<div class="pairs">${cards.map((c,i)=>`<button class="card" data-i="${i}">${c.t==='e'?`<span class="e">${c.v}</span>`:`<span class="w">${esc(c.v)}</span>`}</button>`).join('')}</div>
        <div class="row"><button class="btn ghost" id="back">놀이 고르기</button></div>`);
  $('back').onclick=learnMenu;
  on('[data-i]',e=>{
    const b=e.currentTarget,c=cards[+b.dataset.i];
    if(c.t==='w')speak(c.v);
    if(!sel){sel={b,c};b.classList.add('sel');return}
    if(sel.b===b){b.classList.remove('sel');sel=null;return}
    if(sel.c.k===c.k&&sel.c.t!==c.t){ding();addStar(1);const a=sel.b;a.classList.remove('sel');later(()=>{a.classList.add('done');b.classList.add('done')},250);sel=null;left--;
      say('chorok',`${c.k}! 짝꿍을 찾았어!`);if(left===0)later(()=>finish('chorok',pairs),900)}
    else{oops();[sel.b,b].forEach(x=>{x.classList.remove('wrong');void x.offsetWidth;x.classList.add('wrong')});sel.b.classList.remove('sel');sel=null;say('chorok','짝꿍이 아니야. 다시 찾아 볼까?')}
  });
}
/* ---------- 별빛 마을 ---------- */
const ROOMS=[['거실','peach'],['침실','sky'],['욕실','mint']];
function village(){
  clearTimers();
  say('pangi',`별빛 마을에 온 걸 환영해! 별은 ${S.stars}개 있어.`);
  const friends=['ttobi','gli','chorok','darami','pangi'];
  view(`<div class="village">
     <button class="house mine c2" id="mine"><div class="roof"></div><div class="wall"><span class="mag">${S.name?esc(S.name[0]):'나'}</span></div><b>${S.name?esc(S.name)+'의 방':'내 방'}</b></button>
     ${friends.map(f=>`<button class="house ${CH[f].c==='c2'&&f==='pangi'?'c5':CH[f].c}" data-f="${f}"><div class="roof"></div><div class="wall"><img src="${CH[f].img}" alt=""></div><b>${CH[f].name}네 집</b></button>`).join('')}
   </div><div class="row"><button class="btn ghost" id="toLearn">한글 놀이 하러 가기</button></div>`);
  $('mine').onclick=()=>myRoom(0);on('[data-f]',e=>friendHouse(e.currentTarget.dataset.f));$('toLearn').onclick=learnMenu;
}
function friendHouse(f){
  clearTimers();
  const ch=CH[f];const [w,e]=ch.word;const first=initialOf(w);
  const play={ttobi:'listen',gli:'build',chorok:'pairs',darami:'picture',pangi:'balloon'}[f];
  say(f,`${kid()}! 안녕? ${ch.hi}`);
  view(`<div class="friend ${f==='pangi'?'c5':ch.c}"><img src="${ch.img}" alt="${ch.name}"><p>${ch.name}가 제일 좋아하는 낱말</p>
     <button class="fav" id="fav"><span style="font-size:52px">${e}</span><span>${esc(w)}</span>${mag(first,C.indexOf(first))}</button></div>
     <div class="row"><button class="btn" id="play">${ch.name}랑 놀기</button><button class="btn ghost" id="back">마을로 가기</button></div>`);
  $('fav').onclick=()=>speak(`${w}. ${eun(w)} ${ro(NAME[first])} 시작해.`);
  $('play').onclick=()=>startGame(play);$('back').onclick=village;
}
function myRoom(r){
  clearTimers();
  const key='r'+r,shop=ROOM_SHOPS[r];
  S.owned[key]=S.owned[key]||[];S.placed[key]=S.placed[key]||[];
  const bg=S.bg[key]||ROOMS[r][1];let sel=-1;
  say('pangi',`별로 물건을 사서 ${eul(ROOMS[r][0])} 꾸며 봐. 물건은 손가락으로 끌어서 옮겨.`);
  const pic=i=>{const id=r+'-'+i;return ITEM_SVG[id]?`<img src="${ITEM_SVG[id]}" alt="">`:`<span class="e">${shop[i][0]}</span>`};
  function render(){
    view(`<div class="roombox">
      <div class="tabs">${ROOMS.map((x,i)=>`<button class="${i===r?'on':''}" data-room="${i}">${x[0]}</button>`).join('')}<span style="flex:1"></span>
        <div class="swatches">${Object.keys(ROOM_BG).map(k=>`<button class="${k===bg?'on':''}" data-bg="${k}" style="background-image:url('${ROOM_BG[k]}')" aria-label="벽지 바꾸기"></button>`).join('')}</div></div>
      <div class="room" id="room" style="background-image:url('${ROOM_BG[bg]}')">${S.placed[key].map((p,k)=>`<div class="piece ${p.f?'flip':''} ${k===sel?'sel':''}" data-p="${k}" style="left:${p.x}%;top:${p.y}%;width:${ITEM_SVG[r+'-'+p.i]?15:10}%">${pic(p.i)}</div>`).join('')}</div>
      <div class="toolbar">${sel>=0?'<button class="btn ghost" id="flip">좌우 뒤집기</button><button class="btn ghost" id="away">치우기</button><button class="btn ghost" id="desel">다 옮겼어</button>':''}</div>
      <div class="shop">${shop.map((it,i)=>{const own=S.owned[key].includes(i),placed=S.placed[key].some(p=>p.i===i);
        return `<button class="item ${placed?'placed':''}" data-it="${i}"><span class="pic">${pic(i)}</span><span>${esc(it[1])}</span><span class="cost">${own?(placed?'놓여 있어요':'놓기'):`<svg viewBox="0 0 24 24"><path fill="#FFC21F" d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.6l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></svg>${it[2]}개`}</span></button>`}).join('')}</div>
      <div class="row"><button class="btn ghost" id="back">마을로 가기</button></div></div>`);
    on('[data-room]',e=>myRoom(+e.currentTarget.dataset.room));
    on('[data-bg]',e=>{S.bg[key]=e.currentTarget.dataset.bg;store.set('bg',S.bg);myRoom(r)});
    $('back').onclick=village;
    on('[data-it]',e=>{const i=+e.currentTarget.dataset.it,it=shop[i];
      if(S.owned[key].includes(i)){if(!S.placed[key].some(p=>p.i===i)){S.placed[key].push({i,x:50,y:62,f:false});sel=S.placed[key].length-1;save();render()}return}
      if(S.stars<it[2]){oops();say('pangi',`${eun(it[1])} 별 ${it[2]}개가 필요해. 한글 놀이로 별을 더 모아 보자!`);return}
      S.stars-=it[2];store.set('stars',S.stars);$('starN').textContent=S.stars;S.owned[key].push(i);S.placed[key].push({i,x:50,y:62,f:false});sel=S.placed[key].length-1;save();ding();
      say('pangi',`${eul(it[1])} 샀어! 원하는 곳으로 끌어서 놓아 봐.`);render()});
    if(sel>=0){$('flip').onclick=()=>{S.placed[key][sel].f=!S.placed[key][sel].f;save();render()};
      $('away').onclick=()=>{S.placed[key].splice(sel,1);sel=-1;save();render()};$('desel').onclick=()=>{sel=-1;render()}}
    const room=$('room');
    room.querySelectorAll('[data-p]').forEach(el=>{
      el.addEventListener('pointerdown',ev=>{ev.preventDefault();const k=+el.dataset.p;if(sel!==k){sel=k;room.querySelectorAll('.piece').forEach(x=>x.classList.toggle('sel',+x.dataset.p===k));
          const tb=VIEW.querySelector('.toolbar');tb.innerHTML='<button class="btn ghost" id="flip">좌우 뒤집기</button><button class="btn ghost" id="away">치우기</button><button class="btn ghost" id="desel">다 옮겼어</button>';
          $('flip').onclick=()=>{S.placed[key][sel].f=!S.placed[key][sel].f;save();render()};$('away').onclick=()=>{S.placed[key].splice(sel,1);sel=-1;save();render()};$('desel').onclick=()=>{sel=-1;render()}}
        el.setPointerCapture(ev.pointerId);const rr=room.getBoundingClientRect();
        const mv=e2=>{const x=Math.max(4,Math.min(96,(e2.clientX-rr.left)/rr.width*100)),y=Math.max(8,Math.min(94,(e2.clientY-rr.top)/rr.height*100));el.style.left=x+'%';el.style.top=y+'%';S.placed[key][k].x=x;S.placed[key][k].y=y};
        const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);save()};
        el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
      });
    });
  }
  function save(){store.set('owned',S.owned);store.set('placed',S.placed)}
  render();
}
/* ---------- 시작 ---------- */
$('starN').textContent=S.stars;setSoundIcon();goHome();
</script>
</body>
</html>
